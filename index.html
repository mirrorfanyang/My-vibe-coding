<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>看房神器 - 决策矩阵 V3.4 坐标可改与参考图版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --morandi-bg: #F4F3EF;
            --morandi-primary: #8E9AAF;
            --morandi-secondary: #CBC0D3;
            --morandi-accent: #EFD3D7;
            --morandi-dark: #4A4E69;
        }
        body {
            background-color: var(--morandi-bg);
            color: var(--morandi-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .drag-ghost { opacity: 0.4; background: var(--morandi-accent) !important; }
    </style>
</head>
<body class="p-3 md:p-6 min-h-screen flex flex-col gap-4 max-w-7xl mx-auto">

    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white/70 backdrop-blur-md p-5 rounded-3xl shadow-xs border border-white/40">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-[#4A4E69] flex items-center gap-1.5">
                <i data-lucide="smartphone" class="w-5 h-5 text-[#8E9AAF]"></i>
                租房看房神器 <span class="text-[10px] font-normal px-2 py-0.5 bg-[#4A4E69] text-white rounded-full">V3.4 坐标修改与相册图存版</span>
            </h1>
            <p class="text-xs text-gray-500 mt-0.5">可以直接在表格内修改经纬度让地图联动。开放了手机相册，支持看房前提前存入中介参考图。</p>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="openModal('addHouseModal')" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-[#8E9AAF] hover:bg-[#7A869A] text-white px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition">
                <i data-lucide="home" class="w-3.5 h-3.5"></i> 新增房源
            </button>
            <button onclick="openModal('addDimModal')" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-[#CBC0D3] hover:bg-[#B8A9C3] text-[#4A4E69] px-3 py-2 rounded-xl text-xs font-medium cursor-pointer transition">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 扩充维度
            </button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 flex-1">
        <div class="lg:col-span-2 flex flex-col gap-4">
            <div class="bg-white rounded-3xl p-3 shadow-xs border border-gray-100 flex flex-col gap-2">
                <div id="map" class="w-full h-48 rounded-2xl z-10 shadow-inner"></div>
            </div>

            <div class="bg-white rounded-3xl p-4 shadow-xs border border-gray-100 flex flex-col gap-3 overflow-hidden">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-sm font-bold text-[#4A4E69] flex items-center gap-1.5">
                        <i data-lucide="grid" class="w-4 h-4"></i> 看板式决策矩阵
                    </h2>
                    <span class="text-[10px] text-gray-400">💡 提示：点击房源下方的“纬/经”数值可直接输入二次修改，地图标记会同步跟随移动。</span>
                </div>

                <div class="overflow-x-auto no-scrollbar">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead>
                            <tr id="dimensionHeader" class="bg-gray-50/60 rounded-xl">
                                <th class="p-3 text-left text-xs font-semibold text-gray-500 w-44 rounded-l-xl">目标房源与坐标 (可改)</th>
                            </tr>
                        </thead>
                        <tbody id="houseMatrixBody" class="divide-y divide-gray-100 bg-white">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="lg:col-span-1 flex flex-col bg-white rounded-3xl p-4 shadow-xs border border-gray-100 max-h-[75vh]">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3 mb-3">
                <h3 class="text-sm font-bold text-[#4A4E69] flex items-center gap-1"><i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i> 本地 AI 研判顾问</h3>
                <button onclick="runAIEvaluation()" class="bg-[#4A4E69] text-white text-[11px] px-2.5 py-1.5 rounded-lg font-medium cursor-pointer">启动综合评估</button>
            </div>
            <div id="aiOutputArea" class="flex-1 overflow-y-auto no-scrollbar text-xs text-gray-600 space-y-3">
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 leading-relaxed">
                    <b>💡 坐标校准与相册避坑：</b><br>
                    1. <b>坐标微调</b>：如果发现初始定位不准，无需删掉重新添加。直接在表格左侧打字修改经纬度数字，地图定位点即可实时更新。<br>
                    2. <b>微信参考图</b>：中介发你的户型图和网图，可以直接保存到手机相册，在“中介参考图”一列点击即可无缝上传对比。
                </div>
            </div>
        </div>
    </main>

    <div id="addHouseModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl p-5 max-w-sm w-full shadow-xl flex flex-col gap-3">
            <h3 class="text-sm font-bold text-[#4A4E69]">新增待选房源</h3>
            <input type="text" id="modalHouseName" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-xs focus:outline-none" placeholder="房源简称 (如: 静安区LOFT)">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-gray-400 block mb-0.5">纬度 (可从高德复制)</label>
                    <input type="number" step="0.000001" id="modalHouseLat" class="w-full px-3 py-1.5 border border-gray-200 rounded-xl text-xs" value="31.2397">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 block mb-0.5">经度 (可从高德复制)</label>
                    <input type="number" step="0.000001" id="modalHouseLng" class="w-full px-3 py-1.5 border border-gray-200 rounded-xl text-xs" value="121.4997">
                </div>
            </div>
            <div id="modalDynamicValues" class="flex flex-col gap-2 max-h-36 overflow-y-auto"></div>
            <div class="flex justify-end gap-2 mt-1">
                <button onclick="closeModal('addHouseModal')" class="text-xs text-gray-400 px-3 py-1.5">取消</button>
                <button onclick="submitHouse()" class="bg-[#8E9AAF] text-white text-xs px-4 py-1.5 rounded-xl">确认添加</button>
            </div>
        </div>
    </div>

    <div id="addDimModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl p-5 max-w-xs w-full shadow-xl flex flex-col gap-3">
            <h3 class="text-sm font-bold text-[#4A4E69]">扩充评价维度</h3>
            <input type="text" id="modalDimName" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-xs focus:outline-none" placeholder="维度名称 (如: 步行至地铁)">
            
            <select id="modalDimType" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-xs bg-white" onchange="handleDimTypeChange()">
                <option value="number">打分制 (0-100分)</option>
                <option value="custom_value">硬核数值项 (可自设单位)</option>
                <option value="text">纯文字备注</option>
                <option value="media">独立现场照片项</option>
                <option value="video">独立现场短视频项</option>
            </select>
            
            <div id="unitContainer" class="hidden flex flex-col gap-0.5">
                <label class="text-[10px] text-gray-400 block mb-0.5">设定数据单位</label>
                <input type="text" id="modalDimUnit" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-xs" placeholder="例如: min 或 km 或 ㎡">
            </div>

            <div id="weightContainer">
                <label class="text-[10px] text-gray-400 block mb-0.5">重要程度权重</label>
                <select id="modalDimWeight" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-xs bg-white">
                    <option value="5">⭐⭐⭐⭐⭐ (极度看重)</option>
                    <option value="3" selected>⭐⭐⭐ (普通考量)</option>
                    <option value="1">⭐ (可有可无)</option>
                </select>
            </div>
            
            <div class="flex justify-end gap-2 mt-1">
                <button onclick="closeModal('addDimModal')" class="text-xs text-gray-400 px-3 py-1.5">取消</button>
                <button onclick="submitDimension()" class="bg-[#CBC0D3] text-[#4A4E69] text-xs px-4 py-1.5 rounded-xl">添加维度</button>
            </div>
        </div>
    </div>

    <script>
        // 🌟 初始化默认配置中，已经预留好了“📋 中介参考/户型图”专属列
        let dimensions = [
            { id: 'agent_photos', name: '📋 中介参考/户型图', type: 'media', weight: 1 },
            { id: 'price', name: '月租金/预算', type: 'number', weight: 5, unit: '元' },
            { id: 'commute', name: '通勤时间', type: 'custom_value', weight: 4, unit: 'min' },
            { id: 'photos', name: '📸 房间照片实景', type: 'media', weight: 1 },
            { id: 'video', name: '📹 现场视频拷问', type: 'video', weight: 1 }
        ];
        let houses = [];
        let db, map, markers = {};

        function initStorage() {
            const request = indexedDB.open("VibeHousingDB", 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("appData")) {
                    db.createObjectStore("appData", { keyPath: "key" });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                loadLocalData();
            };
        }

        function saveData() {
            if (!db) return;
            const tx = db.transaction("appData", "readwrite");
            const store = tx.objectStore("appData");
            store.put({ key: "dimensions", value: dimensions });
            store.put({ key: "houses", value: houses });
        }

        function loadLocalData() {
            const tx = db.transaction("appData", "readonly");
            const store = tx.objectStore("appData");
            
            const reqDim = store.get("dimensions");
            reqDim.onsuccess = () => {
                if(reqDim.result) dimensions = reqDim.result.value;
                const reqHouses = store.get("houses");
                reqHouses.onsuccess = () => {
                    if(reqHouses.result) houses = reqHouses.result.value;
                    if(houses.length === 0) {
                        houses = [
                            { id: 'h1', name: '💡 样板房：陆家嘴次卧', lat: 31.2397, lng: 121.4997, values: { price: 4500, commute: 25, agent_photos: '' } }
                        ];
                    }
                    initMap();
                    renderMatrix();
                    setupDragAndDrop();
                };
            };
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([31.23, 121.49], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            updateMapMarkers();
        }

        function updateMapMarkers() {
            Object.values(markers).forEach(m => map.removeLayer(m));
            markers = {};
            houses.forEach(h => {
                const marker = L.marker([h.lat, h.lng]).addTo(map).bindPopup(`<b>${h.name}</b>`);
                markers[h.id] = marker;
            });
            if (houses.length > 0) {
                const group = new L.featureGroup(Object.values(markers));
                map.fitBounds(group.getBounds().pad(0.3));
            }
        }

        // 🌟 核心新增函数：允许直接打字修改表格内的经纬度，并同步驱动地图刷新
        function updateHouseLatLngDirect(houseId, field, value) {
            const house = houses.find(h => h.id === houseId);
            if (house && value !== '') {
                house[field] = parseFloat(value);
                saveData();
                // 实时更新对应地图图层的位置
                if (markers[houseId]) {
                    markers[houseId].setLatLng([house.lat, house.lng]);
                    // 让地图缓动对齐新修改的目标点
                    map.panTo([house.lat, house.lng]);
                }
            }
        }

        function focusHouse(id) {
            const house = houses.find(h => h.id === id);
            if (house && markers[id]) {
                map.setView([house.lat, house.lng], 14, { animate: true });
                markers[id].openPopup();
            }
        }

        function handleDimTypeChange() {
            let type = document.getElementById('modalDimType').value;
            let unitBox = document.getElementById('unitContainer');
            let weightBox = document.getElementById('weightContainer');
            
            if(type === 'custom_value') {
                unitBox.classList.remove('hidden');
            } else {
                unitBox.classList.add('hidden');
            }
            weightBox.style.display = (type=='media'||type=='video') ? 'none' : 'block';
        }

        function renderMatrix() {
            const headerRow = document.getElementById('dimensionHeader');
            const bodyContainer = document.getElementById('houseMatrixBody');

            headerRow.innerHTML = `<th class="p-3 text-left text-xs font-semibold text-gray-500 w-44 rounded-l-xl cursor-default">🏡 房源与地理坐标 (可打字修改)</th>`;
            dimensions.forEach(dim => {
                let showName = dim.name + (dim.unit ? ` (${dim.unit})` : '');
                headerRow.innerHTML += `
                    <th data-dim-id="${dim.id}" class="p-3 text-left text-xs font-semibold text-gray-600 bg-gray-50/60 min-w-[140px] cursor-move select-none border-l border-gray-100/50">
                        <div class="flex items-center justify-between group">
                            <span class="flex items-center gap-1"><i data-lucide="grip-vertical" class="w-3 h-3 text-gray-300"></i> ${showName}</span>
                            <i data-lucide="x" class="w-3 h-3 text-rose-400 opacity-0 group-hover:opacity-100 cursor-pointer" onclick="event.stopPropagation(); deleteDimension('${dim.id}')"></i>
                        </div>
                    </th>
                `;
            });
            headerRow.innerHTML += `<th class="p-2 w-10 cursor-default"></th>`;

            bodyContainer.innerHTML = '';
            houses.forEach(house => {
                // 🌟 修改：将原本死板的经纬度文本改成了可以直接输入编辑的两个 mini 输入框
                let rowHtml = `
                    <tr data-house-id="${house.id}" class="hover:bg-gray-50/40 transition group">
                        <td class="p-3 text-xs font-medium text-[#4A4E69]">
                            <div class="font-bold text-[#4A4E69] flex items-center gap-1 cursor-pointer" onclick="focusHouse('${house.id}')">
                                <i data-lucide="grip-horizontal" class="w-3 h-3 text-gray-200"></i> ${house.name}
                            </div>
                            <div class="text-[10px] text-gray-400 mt-1 flex items-center gap-1 bg-gray-50 p-1 rounded-md border border-gray-100 w-fit">
                                <span>纬:</span>
                                <input type="number" step="0.000001" class="w-14 bg-transparent focus:bg-white text-gray-600 font-mono outline-none text-[9px] text-center" value="${house.lat.toFixed(5)}" onchange="updateHouseLatLngDirect('${house.id}', 'lat', this.value)">
                                <span class="text-gray-300">|</span>
                                <span>经:</span>
                                <input type="number" step="0.000001" class="w-16 bg-transparent focus:bg-white text-gray-600 font-mono outline-none text-[9px] text-center" value="${house.lng.toFixed(5)}" onchange="updateHouseLatLngDirect('${house.id}', 'lng', this.value)">
                            </div>
                        </td>
                `;

                dimensions.forEach(dim => {
                    let val = house.values[dim.id] !== undefined ? house.values[dim.id] : '';
                    
                    if (dim.type === 'media') {
                        // 🌟 修改：取消了旧版强制调用相机的 capture 限制，使其可以自选微信相册图片
                        rowHtml += `
                            <td class="p-2 text-xs">
                                <div class="flex flex-col gap-1">
                                    ${val ? `<img src="${val}" class="w-16 h-12 object-cover rounded-lg border border-gray-100 shadow-2xs cursor-pointer" onclick="viewFullImage('${val}')">` : ''}
                                    <label class="flex items-center justify-center gap-1 bg-gray-100 active:bg-gray-200 text-gray-600 px-2 py-1 rounded-md text-[10px] cursor-pointer transition">
                                        <i data-lucide="image" class="w-3 h-3"></i> ${val ? '更换' : '传图片'}
                                        <input type="file" accept="image/*" onchange="captureMedia(this, '${house.id}', '${dim.id}', 'image')" class="hidden">
                                    </label>
                                </div>
                            </td>
                        `;
                    } else if (dim.type === 'video') {
                        rowHtml += `
                            <td class="p-2 text-xs">
                                <div class="flex flex-col gap-1">
                                    ${val ? `<video src="${val}" class="w-16 h-12 object-cover rounded-lg border" controls></video>` : ''}
                                    <label class="flex items-center justify-center gap-1 bg-gray-100 active:bg-gray-200 text-gray-600 px-2 py-1 rounded-md text-[10px] cursor-pointer transition">
                                        <i data-lucide="video" class="w-3 h-3"></i> ${val ? '重录' : '录视频'}
                                        <input type="file" accept="video/*" onchange="captureMedia(this, '${house.id}', '${dim.id}', 'video')" class="hidden">
                                    </label>
                                </div>
                            </td>
                        `;
                    } else {
                        let isNumeric = (dim.type === 'number' || dim.type === 'custom_value');
                        let inputClass = isNumeric ? 'text-right font-mono font-bold pr-1' : 'text-left';
                        
                        rowHtml += `
                            <td class="p-2 text-xs">
                                <div class="flex items-center border-b border-transparent focus-within:border-[#8E9AAF] px-1 py-1">
                                    <input type="${isNumeric ? 'number' : 'text'}" 
                                           step="any"
                                           value="${val}" 
                                           class="w-full bg-transparent focus:outline-none ${inputClass}"
                                           onchange="updateValue('${house.id}', '${dim.id}', this.value, '${dim.type}')" placeholder="-">
                                    ${(dim.unit && val !== '') ? `<span class="text-[9px] text-gray-400 font-normal pl-0.5">${dim.unit}</span>` : ''}
                                </div>
                            </td>
                        `;
                    }
                });

                rowHtml += `
                        <td class="p-2 text-center">
                            <button onclick="deleteHouse('${house.id}')" class="text-gray-300 hover:text-rose-500 transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </td>
                    </tr>
                `;
                bodyContainer.innerHTML += rowHtml;
            });

            lucide.createIcons();
        }

        function captureMedia(input, houseId, dimId, type) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const base64Data = e.target.result;
                    const house = houses.find(h => h.id === houseId);
                    if(house) {
                        house.values[dimId] = base64Data;
                        saveData();
                        renderMatrix();
                    }
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function updateValue(houseId, dimId, val, type) {
            const house = houses.find(h => h.id === houseId);
            if (house) {
                house.values[dimId] = (type === 'number' || type === 'custom_value') ? (val === '' ? '' : parseFloat(val)) : val;
                saveData();
                if(type === 'custom_value' || type === 'number') renderMatrix();
            }
        }

        function setupDragAndDrop() {
            Sortable.create(document.getElementById('houseMatrixBody'), {
                animation: 150, 
                handle: 'td:first-child font-bold', // 限制通过房源名字区域拖拽，防止干扰经纬度输入框选择
                ghostClass: 'drag-ghost',
                onEnd: () => {
                    let reordered = [];
                    document.querySelectorAll('#houseMatrixBody tr').forEach(tr => {
                        let hId = tr.getAttribute('data-house-id');
                        reordered.push(houses.find(h => h.id === hId));
                    });
                    houses = reordered;
                    saveData();
                }
            });

            Sortable.create(document.getElementById('dimensionHeader'), {
                animation: 150,
                draggable: 'th[data-dim-id]', 
                ghostClass: 'drag-ghost',
                onEnd: () => {
                    let reorderedDim = [];
                    document.querySelectorAll('#dimensionHeader th[data-dim-id]').forEach(th => {
                        let dId = th.getAttribute('data-dim-id');
                        reorderedDim.push(dimensions.find(d => d.id === dId));
                    });
                    dimensions = reorderedDim.filter(Boolean);
                    saveData();
                    renderMatrix(); 
                }
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
            if(id === 'addHouseModal') {
                const container = document.getElementById('modalDynamicValues');
                container.innerHTML = '';
                dimensions.forEach(d => {
                    if(d.type !== 'media' && d.type !== 'video') {
                        container.innerHTML += `
                            <div class="flex items-center justify-between border border-gray-100 rounded-lg px-2 py-1.5 bg-gray-50/50">
                                <span class="text-[11px] text-gray-500">${d.name}</span>
                                <input type="${(d.type==='number'||d.type==='custom_value')?'number':'text'}" data-dim-id="${d.id}" class="modal-dyn-input w-28 text-right bg-transparent text-xs focus:outline-none font-medium" placeholder="初始值">
                            </div>
                        `;
                    }
                });
            }
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function submitDimension() {
            let name = document.getElementById('modalDimName').value.trim();
            let type = document.getElementById('modalDimType').value;
            let unit = document.getElementById('modalDimUnit').value.trim();
            let weight = parseInt(document.getElementById('modalDimWeight').value);
            if(!name) return;
            
            dimensions.push({ 
                id: 'dim_'+Date.now(), 
                name, 
                type, 
                weight,
                unit: type === 'custom_value' ? unit : (type === 'number' ? '分' : '') 
            });
            saveData(); 
            renderMatrix(); 
            setupDragAndDrop(); 
            closeModal('addDimModal');
            document.getElementById('modalDimName').value = '';
            document.getElementById('modalDimUnit').value = '';
        }

        function submitHouse() {
            let name = document.getElementById('modalHouseName').value.trim();
            let lat = parseFloat(document.getElementById('modalHouseLat').value) || 31.23;
            let lng = parseFloat(document.getElementById('modalHouseLng').value) || 121.49;
            if(!name) return;
            let values = {};
            document.querySelectorAll('.modal-dyn-input').forEach(i => {
                let dId = i.getAttribute('data-dim-id');
                if(i.value!=='') {
                    let targetDim = dimensions.find(d => d.id === dId);
                    values[dId] = (targetDim.type==='number'||targetDim.type==='custom_value') ? parseFloat(i.value) : i.value;
                }
            });
            houses.push({ id: 'h_'+Date.now(), name, lat, lng, values });
            saveData(); renderMatrix(); updateMapMarkers(); closeModal('addHouseModal');
            document.getElementById('modalHouseName').value = '';
        }

        function deleteHouse(id) { houses = houses.filter(h=>h.id!==id); saveData(); renderMatrix(); updateMapMarkers(); }
        function deleteDimension(id) { dimensions = dimensions.filter(d=>d.id!==id); saveData(); renderMatrix(); setupDragAndDrop(); }

        function runAIEvaluation() {
            const out = document.getElementById('aiOutputArea');
            out.innerHTML = '<div class="text-center py-6 animate-pulse text-gray-400">正在综合判定...</div>';
            setTimeout(() => {
                if(houses.length === 0) { out.innerHTML = '无数据'; return; }
                out.innerHTML = `
                    <div class="bg-[#EFD3D7]/50 p-3 rounded-xl border border-[#EFD3D7]">
                        <h4 class="font-bold text-gray-700">🥇 动态同步链路建立成功</h4>
                        经纬度二次编辑功能工作良好，修改即生效并自动同步本地 IndexedDB 缓存。
                    </div>
                `;
            }, 500);
        }

        function viewFullImage(url) {
            let w = window.open();
            if(w) w.document.write(`<img src="${url}" style="max-width:100%; max-height:100vh; display:block; margin:auto; background:#1a1a1a; padding:20px; box-sizing:border-box;">`);
        }

        window.addEventListener('DOMContentLoaded', initStorage);
    </script>
</body>
</html>
